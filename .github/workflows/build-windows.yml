name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      model:
        description: Whisper model to bundle
        type: choice
        default: small
        options:
          - tiny
          - base
          - small
          - medium
          - large-v3

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: npm ci

      - name: Create worker Python environment
        shell: pwsh
        run: |
          python -m venv worker\.venv
          worker\.venv\Scripts\python -m pip install --upgrade pip
          worker\.venv\Scripts\pip install -r worker\requirements.txt

      - name: Stage worker into bundle resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            -Path src-tauri\resources\worker\models\whisper-cpp, `
                  src-tauri\resources\worker\bin | Out-Null
          Copy-Item worker\*.py src-tauri\resources\worker\
          Copy-Item worker\requirements.txt src-tauri\resources\worker\
          Copy-Item worker\.venv src-tauri\resources\worker\.venv -Recurse

      - name: Bundle ffmpeg (static build)
        shell: pwsh
        run: |
          curl.exe -sL -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $exe = Get-ChildItem -Recurse ffmpeg-tmp -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName src-tauri\resources\worker\bin\ffmpeg.exe

      - name: Bundle Whisper model (${{ github.event.inputs.model }})
        shell: pwsh
        run: |
          $model = "${{ github.event.inputs.model }}"
          curl.exe -sL -o "src-tauri\resources\worker\models\whisper-cpp\ggml-$model.bin" `
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-$model.bin"
          Get-Item "src-tauri\resources\worker\models\whisper-cpp\ggml-$model.bin"

      - name: Build installer
        run: npx tauri build --bundles nsis --config src-tauri/windows-bundle.json

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.event.inputs.model }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
